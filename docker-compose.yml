name: helpkey

x-app: &app
  image: helpkey:local
  build:
    context: .
    args:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID}
  env_file:
    - .env.local
  environment:
    # Services communicate with Redis over Docker's private network.
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}@redis:6379
    QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}@queue-redis:6379
    BACKGROUND_MODE: ${BACKGROUND_MODE:-legacy}
  restart: unless-stopped
  stop_grace_period: 150s
  init: true
  # Avoid Docker inheriting an unavailable local stub resolver. The app needs
  # outbound DNS for Firebase, R2, Cloudflare, and remote Google profile images.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - internal

services:
  queue-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory ${QUEUE_REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal

  web:
    <<: *app
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    ports:
      - "127.0.0.1:3006:3000"

  dispatcher:
    <<: *app
    command: ["node", "dist/workers/media/dispatcher.js"]

  media-worker-1:
    <<: *app
    command: ["node", "dist/workers/media/runner.js"]

  media-worker-2:
    <<: *app
    command: ["node", "dist/workers/media/runner.js"]

  projection-dispatcher:
    <<: *app
    command: ["node", "dist/workers/projections/dispatcher.js"]

  recovery-worker:
    <<: *app
    command: ["node", "dist/workers/shared/recovery-runner.js"]

  projection-worker:
    <<: *app
    command: ["node", "dist/workers/projections/runner.js"]

  booking-worker:
    <<: *app
    command: ["node", "dist/workers/bookings/runner.js"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}@redis:6379
      QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}@queue-redis:6379
      BACKGROUND_MODE: ${BACKGROUND_MODE:-legacy}
      BOOKING_WORKER_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  cleanup:
    <<: *app
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          node dist/workers/media/cleanup.js
          sleep 3600
        done

  media-migrate:
    <<: *app
    profiles: ["migration"]
    restart: "no"
    command: ["node", "dist/workers/media/migrate-firestore-jobs.js"]

  queue-backup:
    image: redis:7.4-alpine
    profiles: ["operations"]
    restart: "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.local}
    volumes:
      - ${QUEUE_BACKUP_DIR:-./backups/queue}:/backup
    networks:
      - internal
    command:
      - /bin/sh
      - -ec
      - |
        redis-cli -h queue-redis --rdb /backup/dump.tmp.rdb
        mv /backup/dump.tmp.rdb "/backup/queue-$$(date -u +%Y%m%dT%H%M%SZ).rdb"
        ls -1t /backup/queue-*.rdb | tail -n +8 | xargs -r rm --

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
  queue-redis-data:
